[project]
name = "finn-engine"
version = "0.1.0"
description = "FINN push-intelligence pipeline: filings -> extraction -> classification -> materiality -> explanation -> feed"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pydantic>=2.6",
  "pyyaml>=6",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
finn = "finn_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["finn_engine*"]

[tool.setuptools.package-data]
finn_engine = ["research/seed/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
